[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "book-to-latex"
version = "1.1.0"
description = "Friendly desktop, browser, and CLI tools for converting documents into LaTeX and compiled PDF"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Book to LaTeX contributors"}]
keywords = ["latex", "pdf", "ocr", "arabic", "ollama", "document-conversion"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
  "pypdf>=6.0,<7",
  "Pillow>=10.4,<13",
  "pillow-heif>=1.0,<2",
  "PyMuPDF>=1.25,<2",
  "pytesseract>=0.3.13,<1",
  "beautifulsoup4>=4.12,<5",
  "charset-normalizer>=3.4,<4",
  "EbookLib>=0.19,<1",
  "odfpy>=1.4,<2",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "striprtf>=0.0.29,<1",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
web = ["streamlit>=1.40,<2"]
build = ["build>=1.2,<2", "pyinstaller>=6.12,<7"]
dev = ["build>=1.2,<2", "pyinstaller>=6.12,<7", "ruff>=0.16,<1", "streamlit>=1.40,<2"]

[project.urls]
Documentation = "https://github.com/kkmmee94/book-to-latex#readme"
Issues = "https://github.com/kkmmee94/book-to-latex/issues"
Source = "https://github.com/kkmmee94/book-to-latex"

[project.scripts]
book-to-latex = "book_to_latex:main"
book-to-latex-gui = "book_to_latex_gui:main"

[tool.setuptools]
py-modules = ["book_to_latex", "book_to_latex_gui", "book_to_latex_streamlit"]

[tool.setuptools.data-files]
"share/book-to-latex/tessdata" = [
  "assets/tessdata/ara.traineddata",
  "assets/tessdata/LICENSE",
  "assets/tessdata/README.md",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
