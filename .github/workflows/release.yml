name: release-builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-cli
          path: |
            dist/*.whl
            dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean book-reader-gui.spec
      - run: choco install innosetup --yes --no-progress
      - shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc packaging\windows\book-to-latex.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-gui
          path: |
            dist/book-reader.exe
            dist/Book-to-LaTeX-Setup-*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -v
      - run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          bash packaging/macos/build-dmg.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-gui
          path: dist/*.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -v
      - run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          bash packaging/linux/build-deb.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-gui
          path: |
            dist/book-to-latex-gui
            dist/*.deb

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-package, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - run: find release-artifacts -type f -maxdepth 3 -print
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
